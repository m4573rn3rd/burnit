##############################################
#  FileName: runner_test.yml
#  FilePath: .github/workflows/runner_test.yml
#  LastDateChanged: 2025-11-23
#  FileDescription: Verifies the 'burnit' runner is active
##############################################

name: Test Burnit Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-runner:
    # ---------------------------------------------------
    # TARGETING YOUR SPECIFIC RUNNER LABEL HERE:
    # ---------------------------------------------------
    runs-on: burnit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Identity Check
        run: |
          echo "Job picked up by runner with label: burnit"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Location: $(pwd)"
      
      - name: Check Python
        run: |
          python3 --version || echo "Python not found"